# ---- Script try-outs added 2026-10-04. Delete this block when done. ----

# Proves the environment: writes what the Script can see and opens it.
[[saved-action]]
id = "script.show-env"
name = "Show Script Env"
symbol = "terminal"
script = { shell = "bash", body = '''
out="$TMPDIR/opie-script-env.txt"
{
  echo "shell: $BASH_VERSION, cwd: $(pwd)"
  echo "PATH=$PATH"
  echo
  for t in brew node ffmpeg python3 docker; do
    printf '%-8s %s\n' "$t" "$(command -v "$t" || echo 'not found')"
  done
  echo
  env | grep '^OPIE_' || echo "no OPIE_ variables (none ticked)"
} > "$out"
open -e "$out"
''' }

# Reads the clipboard through a Context Source, writes it back in capitals.
[[saved-action]]
id = "script.shout-clipboard"
name = "Shout Clipboard"
symbol = "speaker.wave.3"
script = { shell = "bash", body = "printf '%s' \"$OPIE_CLIPBOARD\" | tr '[:lower:]' '[:upper:]' | pbcopy" }
inputs.OPIE_CLIPBOARD = { context = "clipboard" }

# Fails on purpose, so you see the failure notification with the output tail.
[[saved-action]]
id = "script.fail"
name = "Fail on Purpose"
symbol = "xmark.octagon"
script = { shell = "bash", body = "echo 'this is stderr' >&2; echo 'this is stdout'; exit 3" }

