# This one is a script, and its input reads the world when it fires: it
# searches whatever text you have selected. With nothing selected it
# fails and says so.
[[saved-action]]
symbol = "command.square"
id = "search-selection"
name = "Search the Selection"
script = { shell = "bash", body = 'open "https://www.google.com/search?q=$query"' }
inputs.query = { context = "selected-text" }

