# Opie saved actions. Edit this file and restart Opie.
#
# A saved action names an action Opie ships:
#   from = "toggle-dark-mode"
# or carries a script you wrote yourself:
#   script = { shell = "bash", body = "..." }
#
# A script's input can read the world at the moment the slice fires
# instead of holding a fixed value:
#   inputs.query = { context = "selected-text" }
# Contexts: "clipboard", "finder-selection", "frontmost-app",
# "frontmost-document", "selected-text".
#
# The id is what a ring slice points at. Keep it stable.

[[saved-action]]
id = "dark-mode"
name = "Dark Mode"
from = "toggle-dark-mode"

