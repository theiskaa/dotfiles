# Opie rings. Edit this file and restart Opie.
#
# A ring holds 1 to 8 slices. A slice names a saved action:
#   { action = "dark-mode" }
# or holds up to 8 children, reached by flicking further outward:
#   { children = [ { action = "sleep-mac" } ] }
#
# Record a binding in Opie Settings. "fn" and "option-space" remain valid
# names for hand-edited files. A binding with no ring passes through.
#
# A slice holding a switch shows a dot: filled when on, an outline when
# off. The ring appears at once and the dots fill in as the reads answer.

app-ring-binding = { key-code = 58, modifiers = [], is-modifier = true, label = "⌥" }
